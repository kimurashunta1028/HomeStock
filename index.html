<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HomeStock">
<meta name="theme-color" content="#5c776b">
<title>HomeStock</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f2ed;--card:#fffdf9;--ink:#22312b;--muted:#7d8581;--line:#e4e1da;--g:#5c776b;--g2:#dce8e2;--red:#b45142;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;background:rgba(244,242,237,.94);backdrop-filter:blur(14px)}
header small{display:block;color:var(--g);font-weight:800;letter-spacing:.12em;font-size:9px}h1{margin:1px 0 0;font-size:28px}.plus{width:44px;height:44px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:27px}
main{padding:8px 14px 95px}.hero,.card{border-radius:23px;padding:17px;margin-bottom:13px}.hero{background:var(--ink);color:white}.card{background:var(--card);border:1px solid var(--line)}
.row,.head,.stats,.inline,.nav,.scan-grid{display:flex;align-items:center}.head{justify-content:space-between}.head h2,.card h2{font-size:19px;margin:0}.badge{background:#34453e;border-radius:99px;padding:5px 9px;font-weight:800}
.buyrow,.item,.shoprow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.hero .buyrow{border-color:#3c4b45}.grow{flex:1;min-width:0}.name{font-weight:800}.meta,.muted{font-size:12px;color:var(--muted);margin-top:3px}.hero .muted{color:#cbd4d0}
.pill{padding:7px 10px;background:var(--g2);border-radius:99px;font-size:12px;font-weight:800}.pill.out{background:#f1ddd9;color:var(--red)}.warn{color:var(--red);font-weight:800;font-size:12px}.step{display:flex;gap:6px}.step button{border:0;background:#efede8;border-radius:11px;width:36px;height:36px;font-size:19px}
.stats{gap:8px;margin-top:13px}.stat{flex:1;background:#f2f0eb;border-radius:15px;padding:11px}.stat b{font-size:22px;display:block}.stat small{color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,253,249,.96);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:transparent;color:#9aa09d}.nav button.active{color:var(--ink);font-weight:800}.nav span,.nav small{display:block}.nav span{font-size:18px}.nav small{font-size:10px}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.filter{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:99px;white-space:nowrap;color:var(--muted)}.filter.active{background:var(--ink);color:white}
.sheetback{position:fixed;inset:0;z-index:50;background:#1118}.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0}.handle{width:42px;height:5px;background:#c9c7c0;border-radius:99px;margin:8px auto}.sheethead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}.textbtn{border:0;background:transparent;color:var(--g)}.sheetbody{padding:8px 16px 28px}
label{display:block;margin-top:15px;font-size:12px;font-weight:800}input,select{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:13px;background:white}.seg,.manage{display:grid;gap:7px;margin-top:7px}.seg{grid-template-columns:repeat(3,1fr)}.manage{grid-template-columns:1fr 1fr}.seg button,.manage button{border:1px solid var(--line);background:white;border-radius:13px;padding:10px;color:var(--muted)}.seg button.active,.manage button.active{background:var(--ink);color:white}.manage small{display:block;font-size:9px;margin-top:3px}
.inline{gap:8px}.inline>*{flex:1}.primary,.secondary{border:0;border-radius:13px;padding:12px 14px;font-weight:800}.primary{background:var(--ink);color:white}.secondary{background:var(--g2);color:var(--ink)}.wide{width:100%;margin-top:15px}
.scan-grid{gap:9px}.scan-card{flex:1;background:white;border:1px solid var(--line);border-radius:18px;padding:15px;text-align:left}.scan-card b,.scan-card small{display:block}.scan-card small{color:var(--muted);margin-top:5px}
#reader{min-height:270px;background:#111;border-radius:16px;overflow:hidden}.progress{padding:12px;background:var(--g2);border-radius:13px;margin-top:12px}.candidate{display:grid;grid-template-columns:25px 1fr 62px;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.candidate input,.candidate select{margin-top:0;padding:9px}.recipe{background:#f2f0eb;border-radius:14px;padding:11px;margin-top:9px}.toast{position:fixed;z-index:80;left:50%;bottom:100px;transform:translateX(-50%);background:#15201b;color:#fff;padding:10px 14px;border-radius:99px;font-size:12px}

.jan-result{margin-top:10px;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff}
.jan-result b{display:block;font-size:15px}.jan-result .source{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:99px;background:var(--g2);font-size:10px;font-weight:800}
.existing-choice{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
.existing-choice:last-child{border-bottom:0}.existing-choice button{border:0;border-radius:11px;padding:9px 10px;background:var(--g2);color:var(--ink);font-weight:800;font-size:11px}
.photo-scan{display:block;text-align:center;margin-top:9px}
.db-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.db-badge{padding:5px 8px;border-radius:99px;background:#eeece7;color:var(--muted);font-size:10px;font-weight:800}.db-badge.on{background:var(--g2);color:#38574a}

.cloud-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cloud-status{display:flex;align-items:center;gap:8px;margin-top:9px}.dot{width:9px;height:9px;border-radius:50%;background:#aaa}.dot.on{background:#4f8b69}.dot.err{background:#b45142}.sync-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<div id="app">
<header><div><small>HOME INVENTORY · v0.4.1</small><h1>HomeStock</h1></div><button class="plus" id="add">＋</button></header>
<main id="main"></main>
<!-- Begin Yahoo! JAPAN Web Services Attribution Snippet -->
<span style="margin:15px 15px 15px 15px"><a href="https://developer.yahoo.co.jp/sitemap/">Webサービス by Yahoo! JAPAN</a></span>
<!-- End Yahoo! JAPAN Web Services Attribution Snippet -->
<nav class="nav">
<button data-tab="home" class="active"><span>⌂</span><small>ホーム</small></button>
<button data-tab="stock"><span>▦</span><small>在庫</small></button>
<button data-tab="shopping"><span>✓</span><small>買い物</small></button>
<button data-tab="scan"><span>⌁</span><small>スキャン</small></button>
</nav>
</div>

<div id="back" class="sheetback hidden"></div>

<section id="productSheet" class="sheet hidden">
<div class="handle"></div><div class="sheethead"><button class="textbtn close">キャンセル</button><b id="sheetTitle">商品を追加</b><button class="textbtn" id="saveProduct">保存</button></div>
<div class="sheetbody">
<input type="hidden" id="pid"><input type="hidden" id="jan">
<label>商品名<input id="pname" placeholder="例：牛乳"></label>
<label>大分類</label><div class="seg" id="cats"><button data-v="日用品">日用品</button><button data-v="食品">食品</button><button data-v="調味料">調味料</button></div>
<label>管理方法</label><div class="manage" id="types">
<button data-v="count"><b>個数</b><small>卵・箱・缶</small></button>
<button data-v="level"><b>ざっくり残量</b><small>液体など</small></button>
<button data-v="pack"><b>パック</b><small>肉・野菜</small></button>
<button data-v="reserve"><b>使用中＋予備</b><small>日用品</small></button>
</div>
<div class="inline"><label>数量 / 予備<input id="qty" type="number" value="1" min="0"></label><label>単位<input id="unit" value="個"></label></div>
<label>いつもの購入量<input id="buyqty" type="number" value="1" min="1"></label>
<label>賞味・消費期限<div class="inline"><input id="expiry" type="date"><label class="secondary" style="margin-top:6px;text-align:center">写真で読む<input id="expiryPhoto" type="file" accept="image/*" capture="environment" hidden></label></div></label>
<div id="expiryStatus" class="muted"></div>
<button id="deleteProduct" class="wide secondary hidden" style="color:var(--red)">この商品を削除</button>
</div></section>

<section id="barcodeSheet" class="sheet hidden">
<div class="handle"></div><div class="sheethead"><button class="textbtn close">閉じる</button><b>JANコード</b><span></span></div>
<div class="sheetbody">
<div id="reader"></div>
<div class="inline" style="margin-top:10px">
  <button id="switchCamera" class="secondary">カメラ切替</button>
  <button id="restartCamera" class="secondary">カメラ再起動</button>
</div>
<label class="secondary photo-scan">バーコードを写真で読む<input id="barcodePhoto" type="file" accept="image/*" capture="environment" hidden></label>
<p class="muted" id="cameraInfo">バーコードを横向きにして、枠いっぱいに近づけてください。</p>
<label>JANを手入力<div class="inline"><input id="manualJan" inputmode="numeric"><button id="janSearch" class="secondary">検索</button></div></label><div id="janStatus" class="muted"></div></div>
</section>


<section id="janResolveSheet" class="sheet hidden">
<div class="handle"></div><div class="sheethead"><button class="textbtn close">閉じる</button><b>JAN読み取り結果</b><span></span></div>
<div class="sheetbody">
  <div id="janResolveInfo"></div>
  <h3 style="margin:18px 0 4px">登録済みの商品から選ぶ</h3>
  <p class="muted">すでに手入力してある商品なら、ここで紐付ければ次回からJANだけで補充できます。同じ商品に複数JANも登録できます。</p>
  <input id="existingSearch" placeholder="登録済み商品を検索">
  <div id="existingChoices" class="card" style="padding-top:4px;padding-bottom:4px"></div>
  <button id="newFromJan" class="primary wide">新規商品として登録</button>
</div>
</section>

<section id="receiptSheet" class="sheet hidden">
<div class="handle"></div><div class="sheethead"><button class="textbtn close">閉じる</button><b>レシート読み取り</b><span></span></div>
<div class="sheetbody"><p class="muted">商品名・数量・大分類をまとめて候補化します。</p><label class="primary wide" style="text-align:center">レシートを撮影<input id="receiptPhoto" type="file" accept="image/*" capture="environment" hidden></label><div id="receiptProgress" class="progress hidden">読み取り中…</div><div id="candidates"></div><button id="importReceipt" class="primary wide hidden">選択した商品を在庫へ追加</button></div>
</section>

<div id="toast" class="toast hidden"></div>

<script>
const K="homestock.v1",CLOUD_K="homestock.cloud.v1",D={products:[],aliases:{},manual:[],productCache:{},settings:{rakutenAppId:"",rakutenAccessKey:"",yahooClientId:""},meta:{updatedAt:0}};
let cloudClient=null,cloudUser=null,cloudTimer=null,cloudState="off",cloudMessage="";
let data=load(),tab="home",filter="すべて",scanner=null,locked=false,cameraIds=[],cameraIndex=0,currentCameraId="",janResolveState={code:"",product:null};
const $=s=>document.querySelector(s);
function load(){try{
 let x=JSON.parse(localStorage.getItem(K))||{};
 let products=(x.products||[]).map(p=>({...p,jans:Array.isArray(p.jans)?p.jans.filter(Boolean):(p.jan?[p.jan]:[])}));
 return{...D,...x,products,productCache:x.productCache||{},settings:{...D.settings,...(x.settings||{})},meta:{...D.meta,...(x.meta||{})}}
}catch{return JSON.parse(JSON.stringify(D))}}
function save(opts={}){
 data.meta=data.meta||{};
 if(!opts.keepTime)data.meta.updatedAt=Date.now();
 localStorage.setItem(K,JSON.stringify(data));
 if(!opts.localOnly)scheduleCloudPush();
}
function cloudConfig(){
 try{
  const saved=JSON.parse(localStorage.getItem(CLOUD_K))||{};
  return{url:saved.url||"https://ucofoevpmcjluuwoyqez.supabase.co",key:saved.key||"sb_publishable_ySfk6l9PDHFV1Fkem8TTMA_fEO9Nz9e"};
 }catch{return{url:"https://ucofoevpmcjluuwoyqez.supabase.co",key:"sb_publishable_ySfk6l9PDHFV1Fkem8TTMA_fEO9Nz9e"}}
}
function setCloudConfig(v){localStorage.setItem(CLOUD_K,JSON.stringify(v))}
function initCloudClient(){
 const c=cloudConfig();
 if(!c.url||!c.key||!window.supabase){cloudClient=null;cloudUser=null;cloudState="off";return false}
 try{
  cloudClient=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  cloudState="ready";return true;
 }catch(e){cloudClient=null;cloudState="error";cloudMessage="Supabase設定を確認してください";return false}
}
function scheduleCloudPush(){
 if(!cloudClient||!cloudUser)return;
 clearTimeout(cloudTimer);
 cloudTimer=setTimeout(()=>pushCloudState(false),700);
}
async function pushCloudState(showToast=true){
 if(!cloudClient||!cloudUser)return false;
 cloudState="syncing";cloudMessage="同期中…";
 try{
  const payload=JSON.parse(JSON.stringify(data));
  const {error}=await cloudClient.from("home_stock_state").upsert({
   user_id:cloudUser.id,payload,updated_at:new Date(payload.meta?.updatedAt||Date.now()).toISOString()
  },{onConflict:"user_id"});
  if(error)throw error;
  cloudState="online";cloudMessage="クラウド保存済み";
  if(showToast)toast("クラウドへ保存しました");
  return true;
 }catch(e){
  cloudState="error";cloudMessage="同期失敗："+(e?.message||"不明なエラー");
  return false;
 }finally{if(tab==="stock")render()}
}
async function pullCloudState(){
 if(!cloudClient||!cloudUser)return false;
 cloudState="syncing";cloudMessage="クラウドから読込中…";
 try{
  const {data:row,error}=await cloudClient.from("home_stock_state").select("payload,updated_at").eq("user_id",cloudUser.id).maybeSingle();
  if(error)throw error;
  if(!row?.payload){
   await pushCloudState(false);
   cloudState="online";cloudMessage="初回クラウド保存完了";
   return true;
  }
  const remote=row.payload||{};
  const remoteTime=Number(remote?.meta?.updatedAt||new Date(row.updated_at).getTime()||0);
  const localTime=Number(data?.meta?.updatedAt||0);
  const localHas=(data.products?.length||0)+(data.manual?.length||0)>0;
  const remoteHas=(remote.products?.length||0)+(remote.manual?.length||0)>0;
  if(remoteTime>localTime||(!localHas&&remoteHas)){
   data={...D,...remote,products:(remote.products||[]).map(p=>({...p,jans:Array.isArray(p.jans)?p.jans.filter(Boolean):(p.jan?[p.jan]:[])})),productCache:remote.productCache||{},settings:{...D.settings,...(remote.settings||{})},meta:{...D.meta,...(remote.meta||{})}};
   save({localOnly:true,keepTime:true});
   cloudMessage="クラウドから復元しました";
   toast("クラウドの在庫を復元しました");
  }else if(localTime>remoteTime&&localHas){
   await pushCloudState(false);
   cloudMessage="端末の在庫をクラウドへ保存しました";
  }else cloudMessage="同期済み";
  cloudState="online";
  return true;
 }catch(e){
  cloudState="error";cloudMessage="同期失敗："+(e?.message||"不明なエラー");
  return false;
 }finally{render()}
}
async function initCloud(){
 if(!initCloudClient())return;
 try{
  const {data:s}=await cloudClient.auth.getSession();
  cloudUser=s?.session?.user||null;
  cloudClient.auth.onAuthStateChange((event,session)=>{
   cloudUser=session?.user||null;
   if(cloudUser){cloudState="online";setTimeout(()=>pullCloudState(),0)}
   else{cloudState="ready";cloudMessage="ログインしてください";render()}
  });
  if(cloudUser){cloudState="online";await pullCloudState()}
  else{cloudState="ready";cloudMessage="ログインしてください"}
 }catch(e){cloudState="error";cloudMessage="認証状態を取得できません"}
 render();
}
async function cloudSignUp(){
 if(!cloudClient)return toast("先にSupabase設定を保存してください");
 const email=$("#cloudEmail")?.value.trim(),password=$("#cloudPassword")?.value||"";
 if(!email||password.length<6)return toast("メールと6文字以上のパスワードを入力してください");
 const {data:r,error}=await cloudClient.auth.signUp({email,password});
 if(error)return toast("登録失敗："+error.message);
 toast(r?.session?"アカウント作成・ログインしました":"確認メールを送信しました。メール内のリンクを開いてください");
}
async function cloudSignIn(){
 if(!cloudClient)return toast("先にSupabase設定を保存してください");
 const email=$("#cloudEmail")?.value.trim(),password=$("#cloudPassword")?.value||"";
 if(!email||!password)return toast("メールとパスワードを入力してください");
 const {error}=await cloudClient.auth.signInWithPassword({email,password});
 if(error)return toast("ログイン失敗："+error.message);
 toast("ログインしました");
}
async function cloudSignOut(){
 if(cloudClient)await cloudClient.auth.signOut();
 cloudUser=null;cloudState="ready";cloudMessage="ログアウトしました";render();
}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function days(x){if(!x)return null;let a=new Date(x+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.ceil((a-b)/86400000)}
function dlabel(d){if(d<0)return"期限切れ";if(d===0)return"今日";if(d===1)return"明日";return"あと"+d+"日"}
function isout(p){return p.type==="count"?+p.qty<=0:p.type==="level"?p.state==="none":p.type==="pack"?p.state==="none":+p.qty<=0}
function stxt(p){if(p.type==="count")return p.qty+p.unit;if(p.type==="level")return p.state==="high"?"多い":p.state==="low"?"少ない":"なし";if(p.type==="pack")return p.state==="full"?"1パック":p.state==="half"?"半分":"なし";return"予備"+p.qty+p.unit}
function shopping(){return[...data.products.filter(isout).map(p=>({auto:1,id:p.id,name:p.name,qty:p.buyqty||1,unit:p.unit,cat:p.cat})),...data.manual]}
function expiring(){return data.products.map(p=>({...p,dd:days(p.expiry)})).filter(p=>p.dd!=null&&p.dd<=2).sort((a,b)=>a.dd-b.dd)}
function toast(t){let x=$("#toast");x.textContent=t;x.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.add("hidden"),1800)}
function setTab(t){tab=t;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
function render(){let m=$("#main");m.innerHTML=tab==="home"?home():tab==="stock"?stock():tab==="shopping"?shop():scan();bind()}
function home(){
 let s=shopping(),e=expiring(),p=data.products;
 return `<section class="hero"><div class="head"><h2>買うもの</h2><span class="badge">${s.length}</span></div>${s.length?s.slice(0,5).map(x=>`<div class="buyrow"><div class="grow">${esc(x.name)}</div><b>×${x.qty}${esc(x.unit||"")}</b></div>`).join(""):`<p class="muted">いま買うものはありません。</p>`}</section>
 <section class="card"><div class="head"><h2>期限が近い</h2><button class="textbtn" id="toStock">在庫を見る</button></div>${e.length?e.slice(0,5).map(x=>`<div class="item"><div class="grow"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.cat)}</div></div><span class="warn">${dlabel(x.dd)}</span></div>`).join(""):`<p class="muted">2日以内の期限はありません。</p>`}</section>
 <section class="card"><h2>家のストック</h2><div class="stats"><div class="stat"><b>${p.length}</b><small>登録商品</small></div><div class="stat"><b>${p.filter(x=>x.cat==="日用品").length}</b><small>日用品</small></div><div class="stat"><b>${p.filter(x=>x.cat==="食品").length}</b><small>食品</small></div></div></section>${recipes()}`;
}
function recipes(){let f=expiring().filter(x=>x.cat==="食品").slice(0,3);if(!f.length)return`<section class="card"><h2>期限優先レシピ</h2><p class="muted">期限が近い食材が出ると候補を表示します。</p></section>`;let n=f.map(x=>x.name).join("・");return`<section class="card"><h2>期限優先レシピ</h2><div class="recipe"><b>使い切り炒め</b><div class="muted">${esc(n)}を手持ちの調味料で炒める</div></div><div class="recipe"><b>具だくさんスープ</b><div class="muted">${esc(n)}をスープや味噌汁にまとめて使う</div></div></section>`}
function stock(){
 let ps=data.products.filter(p=>filter==="すべて"||p.cat===filter),fs=["すべて","日用品","食品","調味料"],cc=cloudConfig();
 return`<h2>在庫</h2><div class="filters">${fs.map(f=>`<button class="filter ${f===filter?"active":""}" data-filter="${f}">${f}</button>`).join("")}</div>
 <section class="card">${ps.length?ps.map(prow).join(""):`<p class="muted">まだ商品がありません。右上の＋から追加できます。</p>`}</section>
 <section class="card"><div class="head"><h2>クラウド同期</h2><span class="pill ${cloudUser?"":"out"}">${cloudUser?"同期ON":"未接続"}</span></div>

async function refreshCameras(){
 try{
  const cams=await Html5Qrcode.getCameras();
  cameraIds=cams||[];
  return cameraIds;
 }catch{return[]}
}
function cameraLooksRear(label=""){
 return /back|rear|environment|外側|背面|広角|ultra wide|wide/i.test(label);
}
function cameraLooksFront(label=""){
 return /front|user|facetime|内側|前面/i.test(label);
}
function chooseInitialCamera(cams){
 const saved=localStorage.getItem("homestock.cameraId");
 if(saved&&cams.some(c=>c.id===saved))return saved;
 const rear=cams.find(c=>cameraLooksRear(c.label)&&!cameraLooksFront(c.label));
 if(rear)return rear.id;
 return cams.length>1?cams[cams.length-1].id:cams[0]?.id||"";
}
function scannerOptions(){
 return{
  formatsToSupport:[
   Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,
   Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E
  ],
  useBarCodeDetectorIfSupported:true,
  verbose:false
 }
}
async function tuneCamera(){
 try{
  const track=document.querySelector("#reader video")?.srcObject?.getVideoTracks?.()[0];
  if(!track)return;
  const caps=track.getCapabilities?.()||{},adv={};
  if(Array.isArray(caps.focusMode)&&caps.focusMode.includes("continuous"))adv.focusMode="continuous";
  if(Object.keys(adv).length)await track.applyConstraints({advanced:[adv]});
 }catch{}
}
async function startScanner(forceCameraId=""){
 if(scanner)return;
 scanner=new Html5Qrcode("reader",scannerOptions());
 const config={fps:20,qrbox:{width:310,height:165},aspectRatio:1.777778,disableFlip:true};
 const onScan=code=>{if(locked)return;locked=true;lookupJan(code).finally(()=>setTimeout(()=>locked=false,1200))};

 try{
  // First attempt to obtain permission with the rear-camera constraint.
  if(!forceCameraId){
   try{
    await scanner.start({facingMode:"environment"},config,onScan,()=>{});
    const cams=await refreshCameras();
    const currentTrack=document.querySelector("#reader video")?.srcObject?.getVideoTracks?.()[0];
    const settings=currentTrack?.getSettings?.()||{};
    currentCameraId=settings.deviceId||"";
    const selected=cams.find(c=>c.id===currentCameraId);
    if(selected&&cameraLooksFront(selected.label)&&cams.length>1){
      await stopScanner();
      const rearId=chooseInitialCamera(cams);
      if(rearId&&rearId!==currentCameraId)return startScanner(rearId);
    }
    if(currentCameraId)localStorage.setItem("homestock.cameraId",currentCameraId);
    await tuneCamera();updateCameraInfo();
    return;
   }catch{
    try{await scanner.stop()}catch{}
    try{scanner.clear()}catch{}
    scanner=new Html5Qrcode("reader",scannerOptions());
   }
  }

  const cams=await refreshCameras();
  const chosen=forceCameraId||chooseInitialCamera(cams);
  if(!chosen)throw new Error("No camera");
  await scanner.start(chosen,config,onScan,()=>{});
  currentCameraId=chosen;
  const idx=cams.findIndex(c=>c.id===chosen);
  if(idx>=0)cameraIndex=idx;
  localStorage.setItem("homestock.cameraId",chosen);
  await tuneCamera();updateCameraInfo();
 }catch(e){
  try{scanner.clear()}catch{}
  scanner=null;
  $("#janStatus").textContent="カメラを開始できません。Safariのカメラ権限を確認してください。";
 }
}
function updateCameraInfo(){
 const c=cameraIds.find(x=>x.id===currentCameraId);
 const label=c?.label||"カメラ";

 if(info)info.textContent="使用中："+label+" ／ バーコードを横向きにして枠いっぱいに近づけてください。";
}
async function stopScanner(){

async function switchCamera(){
 const cams=await refreshCameras();
 if(cams.length<2){toast("切り替えられるカメラが見つかりません");return}
 const current=cams.findIndex(c=>c.id===currentCameraId);
 cameraIndex=current>=0?(current+1)%cams.length:(cameraIndex+1)%cams.length;
 const next=cams[cameraIndex];
 await stopScanner();
 await startScanner(next.id);
 toast("カメラを切り替えました");
}
function productHasJan(p,code){

 return normalizeJan(p.jan)===code||(p.jans||[]).some(x=>normalizeJan(x)===code)

function restockProduct(pid){

function normalizeJan(code){
 code=String(code||"").replace(/\D/g,"");
 if(code.length===12)code="0"+code;
 return code;
}
function validGtin(code){
 if(!/^\d{8}$|^\d{13}$/.test(code))return false;
 let digits=code.split("").map(Number),check=digits.pop(),sum=0,weight=3;
 for(let i=digits.length-1;i>=0;i--){sum+=digits[i]*weight;weight=weight===3?1:3}
 return ((10-(sum%10))%10)===check;
}
function classifyProduct(text=""){

 if(/洗剤|ティッシュ|シャンプ|コンディショナ|トリートメント|歯磨|歯ブラシ|スポンジ|ラップ|トイレ|柔軟|石鹸|せっけん|ゴミ袋|漂白|ボディソープ|ハンドソープ|掃除|除菌|消臭|キッチンペーパー|おむつ/.test(x))return"日用品";
 if(/醤油|しょうゆ|味噌|みそ|塩|砂糖|食用油|オリーブオイル|ごま油|酢|ソース|ケチャップ|マヨ|だし|胡椒|こしょう|ドレッシング|みりん|料理酒/.test(x))return"調味料";
 return"食品";
}
function jsonp(url,timeout=7000){
 return new Promise((resolve,reject)=>{
  const cb="hsjp_"+Date.now()+"_"+Math.random().toString(36).slice(2),sc=document.createElement("script");
  const timer=setTimeout(()=>done(new Error("timeout")),timeout);
  function done(err,val){clearTimeout(timer);try{delete window[cb]}catch{};sc.remove();err?reject(err):resolve(val)}
  window[cb]=v=>done(null,v);sc.onerror=()=>done(new Error("network"));
  sc.src=url+(url.includes("?")?"&":"?")+"callback="+encodeURIComponent(cb);document.head.appendChild(sc);
 });
}
async function rakutenLookup(code){
 const appId=data.settings.rakutenAppId,accessKey=data.settings.rakutenAccessKey;
 if(!appId||!accessKey)return null;
 const base="https://openapi.rakuten.co.jp/ichibaproduct/api/Product/Search/20250801";
 const qs=new URLSearchParams({format:"json",formatVersion:"2",applicationId:appId,accessKey,productCode:code,hits:"1",elements:"productCode,productName,brandName,makerName,mediumImageUrl,genreName"});
 try{
  const j=await jsonp(base+"?"+qs.toString());
  if(j?.error)return null;
  const item=(j?.products||j?.items||[])[0];
  if(!item)return null;
  const name=item.productName||item.itemName||"";
  if(!name)return null;
  const extra=[item.brandName,item.makerName,item.genreName].filter(Boolean).join(" ");
  return{name,cat:classifyProduct(name+" "+extra),brand:item.brandName||"",maker:item.makerName||"",image:item.mediumImageUrl||"",source:"楽天"};
 }catch{return null}
}

  const brand=h.brand?.name||"",extra=[brand,...(h.parentGenreCategories||[]).map(x=>x.name||"")].join(" ");

function normName(x=""){return String(x).toLowerCase().normalize("NFKC").replace(/[\s　・･\-_/（）()【】\[\]「」『』,，.。]/g,"")}
function nameScore(a,b){
 a=normName(a);b=normName(b);if(!a||!b)return 0;if(a===b)return 100;if(a.includes(b)||b.includes(a))return 75;
 let aa=new Set(),bb=new Set();for(let i=0;i<a.length-1;i++)aa.add(a.slice(i,i+2));for(let i=0;i<b.length-1;i++)bb.add(b.slice(i,i+2));
 let inter=[...aa].filter(x=>bb.has(x)).length,uni=new Set([...aa,...bb]).size;return uni?Math.round(inter/uni*60):0
}
function existingCandidates(product,search=""){
 const q=normName(search),target=product?.name||"";
 return data.products.map(p=>{
  let score=target?nameScore(target,p.name):0;
  if(product?.cat&&p.cat===product.cat)score+=8;
  if(!(p.jans||[]).length&&!p.jan)score+=4;
  if(q&&!normName(p.name).includes(q))score-=1000;
  return{p,score}
 }).filter(x=>x.score>-500).sort((a,b)=>b.score-a.score||a.p.name.localeCompare(b.p.name,"ja")).slice(0,12).map(x=>x.p)
}

async function lookupJan(rawCode){
 let code=normalizeJan(rawCode);if(!code)return;
 $("#janStatus").textContent="JAN "+code+" を検索中…";
 if(!validGtin(code)){toast("JANコードのチェック桁が不正です");$("#janStatus").textContent="読み取り値を確認してください："+code;return}
 let local=data.products.find(p=>productHasJan(p,code));
 if(local){restockProduct(local.id);closeSheets();toast(local.name+" を補充しました");return}
 let cached=data.productCache?.[code];
 if(cached){showJanResolution(code,cached);return}
 $("#janStatus").textContent="複数のデータベースを照合中…";
 const jobs=[rakutenLookup(code),yahooLookup(code),openFactsLookup(code),upcItemDbLookup(code)];
 const rs=await Promise.allSettled(jobs);
 const product=rs.map(x=>x.status==="fulfilled"?x.value:null).find(Boolean)||null;
 if(product){data.productCache=data.productCache||{};data.productCache[code]=product;save()}
 showJanResolution(code,product)
}
async function ocr(file,cb){let r=await Tesseract.recognize(file,"jpn+eng",{logger:m=>{if(m.progress)cb?.(Math.round(m.progress*100))}});return r.data.text||""}
function guess(n){if(/洗剤|ティッシュ|シャンプ|歯磨|ラップ|柔軟|石鹸|ゴミ袋/.test(n))return"日用品";if(/醤油|しょうゆ|味噌|みそ|塩|砂糖|油|酢|ソース|ケチャップ|マヨ|胡椒/.test(n))return"調味料";return"食品"}
function receiptItems(text){let bad=/(合計|小計|税込|税抜|消費税|お預|お釣|現金|クレジット|ポイント|領収|TEL|電話|担当|登録番号|日時)/i,out=[];for(let l of text.split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean)){if(l.length<2||bad.test(l)||/^[\d,\.\-\s]+$/.test(l))continue;let qty=1,m=l.match(/[x×*]\s*(\d{1,2})/i);if(m)qty=+m[1]||1;l=l.replace(/[x×*]\s*\d{1,2}/i,"").replace(/\s+[¥￥]?\d{2,6}\s*$/,"").trim();if(l.length<2)continue;let key=l.toLowerCase().replace(/\s/g,"");out.push({raw:l,name:data.aliases[key]||l,qty,cat:guess(l)})}return out.slice(0,25)}
function showCandidates(a){$("#candidates").innerHTML=a.map((x,i)=>`<div class="candidate"><input type="checkbox" checked data-c="${i}"><div><input value="${esc(x.name)}" data-n="${i}"><select data-cat="${i}"><option ${x.cat==="日用品"?"selected":""}>日用品</option><option ${x.cat==="食品"?"selected":""}>食品</option><option ${x.cat==="調味料"?"selected":""}>調味料</option></select></div><input type="number" min="1" value="${x.qty}" data-q="${i}"></div>`).join("");$("#candidates")._a=a;$("#importReceipt").classList.toggle("hidden",!a.length)}
function dateFrom(text){let t=text.replace(/[年月]/g,"/").replace(/日/g,""),m=t.match(/(20\d{2})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/),n=new Date(),y,mo,d;if(m){y=+m[1];mo=+m[2];d=+m[3]}else if((m=t.match(/(\d{1,2})[\/.\-](\d{1,2})/))){y=n.getFullYear();mo=+m[1];d=+m[2]}else return null;if(mo<1||mo>12||d<1||d>31)return null;return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$("#add").onclick=()=>openProduct();$("#back").onclick=closeSheets;document.querySelectorAll(".close").forEach(b=>b.onclick=closeSheets);document.querySelectorAll("#cats button").forEach(b=>b.onclick=()=>choose("#cats",b.dataset.v));document.querySelectorAll("#types button").forEach(b=>b.onclick=()=>choose("#types",b.dataset.v));$("#saveProduct").onclick=saveProduct;
$("#deleteProduct").onclick=()=>{let x=$("#pid").value;if(x&&confirm("削除しますか？")){data.products=data.products.filter(p=>p.id!==x);save();closeSheets();render()}};
$("#janSearch").onclick=()=>lookupJan($("#manualJan").value);
$("#existingSearch").oninput=e=>renderJanExisting(e.target.value);
$("#newFromJan").onclick=()=>{const {code,product}=janResolveState;closeSheets();openProduct(null,{jan:code,name:product?.name||"",cat:product?.cat||"食品"})};
$("#barcodePhoto").onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 $("#janStatus").textContent="写真からバーコードを読み取り中…";
 await stopScanner();
 let qrcode=null;
 try{
  qrcode=new Html5Qrcode("reader",scannerOptions());
  const code=await qrcode.scanFile(f,true);
  try{qrcode.clear()}catch{}
  qrcode=null;await lookupJan(code)
 }catch(err){
  try{qrcode?.clear()}catch{}
  $("#janStatus").textContent="写真から読み取れませんでした。バーコードを大きく写して再撮影してください。";
 }
};
$("#switchCamera").onclick=()=>switchCamera();
$("#restartCamera").onclick=async()=>{await stopScanner();await startScanner();};
$("#receiptPhoto").onchange=async e=>{let f=e.target.files?.[0];if(!f)return;$("#receiptProgress").classList.remove("hidden");try{let t=await ocr(f,p=>$("#receiptProgress").textContent="読み取り中… "+p+"%");showCandidates(receiptItems(t))}catch{alert("読み取りに失敗しました")}finally{$("#receiptProgress").classList.add("hidden")}};
$("#importReceipt").onclick=()=>{let a=$("#candidates")._a||[];a.forEach((x,i)=>{if(!document.querySelector(`[data-c="${i}"]`).checked)return;let n=document.querySelector(`[data-n="${i}"]`).value.trim(),cat=document.querySelector(`[data-cat="${i}"]`).value,qty=Math.max(1,+document.querySelector(`[data-q="${i}"]`).value||1);if(!n)return;data.aliases[x.raw.toLowerCase().replace(/\s/g,"")]=n;let p=data.products.find(z=>z.name===n&&z.cat===cat);if(p)p.qty=+p.qty+qty;else data.products.unshift({id:uid(),jan:"",name:n,cat,type:"count",qty,unit:"個",buyqty:1,expiry:"",state:"high"})});save();closeSheets();render();toast("在庫へ追加しました")};
$("#expiryPhoto").onchange=async e=>{let f=e.target.files?.[0];if(!f)return;$("#expiryStatus").textContent="期限を読み取り中…";try{let t=await ocr(f),d=dateFrom(t);if(d){$("#expiry").value=d;$("#expiryStatus").textContent="候補："+d}else $("#expiryStatus").textContent="読めませんでした。手入力してください。"}catch{$("#expiryStatus").textContent="読み取りに失敗しました。"}};

choose("#cats","日用品");choose("#types","count");render();initCloud();
</script>
</body></html>
